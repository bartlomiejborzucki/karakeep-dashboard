<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bookmarks Dashboard">
    <!-- script-src 'self' is real protection for the API token in localStorage.
         It is only possible because SortableJS is vendored and no inline handlers remain.
         img-src and connect-src stay open: favicons come from anywhere, and the
         Karakeep instance is whatever host the user configures. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src * data:; connect-src *; base-uri 'none'; object-src 'none'; form-action 'none'">
    <title>Bookmarks</title>
    <link rel="stylesheet" href="styles.css">
    <script src="env.js"></script>
</head><body>
    <div class="container">
        <header class="header">
            <div class="header-top">
                <h1>Bookmarks</h1>
                <div class="header-actions">
                    <button type="button" id="settingsButton" class="karakeep-link" title="Settings" aria-label="Settings">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                    <a href="#" id="karakeepLink" class="karakeep-link" title="Open KaraKeep">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                    </a>
                </div>
            </div>
            <div class="search-bar">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search bookmarks..."
                    aria-label="Search bookmarks"
                />
            </div>
        </header>

        <div id="banner" hidden></div>
        <div id="remotePrompt" hidden></div>

        <main id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Starting…</p>
            </div>
        </main>
        <footer id="footer" class="dashboard-footer" hidden></footer>
    </div>

    <div id="settings" hidden></div>
    <div id="toasts" aria-live="polite"></div>

    <!-- Rewritten by build.mjs to the content-hashed bundle in dist/assets/. -->
    <script type="module" src="src/main.ts"></script>
</body>
</html>
