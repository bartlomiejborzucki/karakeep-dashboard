<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KaraKeep Dashboard — a fast start page for your Karakeep bookmarks">
    <!-- script-src 'self' is real protection for the API token in localStorage.
         It is only possible because SortableJS is vendored and no inline handlers remain.
         img-src and connect-src stay open: favicons come from anywhere, and the
         Karakeep instance is whatever host the user configures. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src * data:; connect-src *; base-uri 'none'; object-src 'none'; form-action 'none'">
    <title>Bookmarks</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="KaraKeep">
    <meta name="application-name" content="KaraKeep">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="env.js"></script>
</head><body>
    <div class="container">
        <header class="header">
            <div class="header-top">
                <h1>Bookmarks</h1>
                <div class="header-actions">
                    <button type="button" id="editModeButton" class="karakeep-link" title="Edit mode" aria-label="Enter edit mode">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                    </button>
                    <button type="button" id="settingsButton" class="karakeep-link" title="Settings" aria-label="Settings">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                    <a href="#" id="karakeepLink" class="karakeep-link" title="Open KaraKeep">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                    </a>
                </div>
            </div>
            <div class="search-bar">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search bookmarks..."
                    aria-label="Search bookmarks"
                />
            </div>
        </header>

        <div id="banner" hidden></div>
        <div id="remotePrompt" hidden></div>

        <main id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Starting…</p>
            </div>
        </main>
        <footer id="footer" class="dashboard-footer" hidden></footer>
    </div>

    <div id="editActionBar" class="edit-action-bar" hidden>
        <div class="edit-action-bar-content">
            <div class="edit-action-info">
                <span class="edit-mode-badge">Edit mode</span>
                <span class="edit-mode-hint">Drag bookmarks between lists, or onto the zones below</span>
            </div>
            <div class="edit-dropzones">
                <div id="archiveDropzone" class="dropzone dropzone-archive" title="Drop here to archive">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="21 8 21 21 3 21 3 8"></polyline>
                        <rect x="1" y="3" width="22" height="5"></rect>
                        <line x1="10" y1="12" x2="14" y2="12"></line>
                    </svg>
                    <span class="dropzone-label">Archive</span>
                </div>
                <div id="trashDropzone" class="dropzone dropzone-trash" title="Drop here to delete">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    <span class="dropzone-label">Delete</span>
                </div>
            </div>
            <button type="button" id="exitEditModeBtn" class="btn-exit-edit">Done</button>
        </div>
    </div>

    <div id="settings" hidden></div>
    <div id="toasts" aria-live="polite"></div>

    <!-- Rewritten by build.mjs to the content-hashed bundle in dist/assets/. -->
    <script type="module" src="src/main.ts"></script>
</body>
</html>
