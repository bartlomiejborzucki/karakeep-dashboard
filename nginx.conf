# Cache-Control is chosen by URI rather than repeated per location, so that a single
# server-level add_header block applies everywhere. (nginx add_header does not merge:
# any location that declares one drops every header inherited from its parent.)
map $uri $kkhd_cache_control {
    # The entry point, the generated config and the service worker must revalidate
    # every time: they are tiny, and a stale one cannot be fixed from the client.
    default          "no-cache";

    # Everything under /assets/ carries a content hash in its filename, so it can
    # be cached forever: a new build produces a new URL. This is the main practical
    # win of adding a build step.
    "~^/assets/"     "max-age=31536000, immutable";
}

server {
    listen       8595;
    listen       [::]:8595;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # No nginx version in the Server header or on error pages: it only helps
    # someone matching the instance against a CVE list.
    server_tokens off;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_vary         on;
    gzip_types        text/css application/javascript text/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $kkhd_cache_control always;
    # The dashboard URL is often an internal hostname; bookmarked sites have no
    # business seeing it. Card links and favicons already opt out individually,
    # this covers everything else (same-tab links, the API host).
    add_header Referrer-Policy "no-referrer" always;
    # Isolates the browsing context, so a bookmarked page opened from here cannot
    # reach back through window.opener even if a link misses rel="noopener".
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # The app uses none of these; deny them so injected code could not either.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Cross-Origin-Resource-Policy and COEP are deliberately absent: homelab
    # dashboards hotlink favicon.svg from here, and favicons come from anywhere.
    # Framing policy (X-Frame-Options / CSP frame-ancestors), generated at start by
    # docker-entrypoint.d/11-frame-ancestors.sh from $FRAME_ANCESTORS; denies
    # framing by default. frame-ancestors is ignored in a <meta> tag, so it is a header.
    include /etc/nginx/kkhd/frame.conf;

    location / {
        try_files $uri $uri/ =404;
    }
}
