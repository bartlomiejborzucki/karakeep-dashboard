# Cache-Control is chosen by URI rather than repeated per location, so that a single
# server-level add_header block applies everywhere. (nginx add_header does not merge:
# any location that declares one drops every header inherited from its parent.)
map $uri $kkhd_cache_control {
    # The entry point, the generated config and the service worker must revalidate
    # every time: they are tiny, and a stale one cannot be fixed from the client.
    default          "no-cache";

    # Everything under /assets/ carries a content hash in its filename, so it can
    # be cached forever: a new build produces a new URL. This is the main practical
    # win of adding a build step.
    "~^/assets/"     "max-age=31536000, immutable";
}

server {
    listen       8595;
    listen       [::]:8595;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_vary         on;
    gzip_types        text/css application/javascript text/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $kkhd_cache_control always;
    # Framing policy (X-Frame-Options / CSP frame-ancestors), generated at start by
    # docker-entrypoint.d/11-frame-ancestors.sh from $FRAME_ANCESTORS; denies
    # framing by default. frame-ancestors is ignored in a <meta> tag, so it is a header.
    include /etc/nginx/kkhd/frame.conf;

    location / {
        try_files $uri $uri/ =404;
    }
}
