services:
  karakeep-dashboard:
    image: ghcr.io/bartlomiejborzucki/karakeep-dashboard:latest
    container_name: karakeep-dashboard
    ports:
      - "8595:8595"
    environment:
      # Optional. Only pre-fills the address on the setup screen; you still paste
      # your API key in the browser, and it is stored there and nowhere else.
      #
      # This must be the address your BROWSER can reach, not a Docker service name.
      KARAKEEP_URL: http://localhost:3000
      # Optional: let a homelab dashboard (Homepage, Homarr, Dashy) embed this one.
      # FRAME_ANCESTORS: http://localhost:3001
    restart: unless-stopped
